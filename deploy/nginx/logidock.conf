# Nginx in PRODUZIONE (Ubuntu Server 24.04).
# Installazione: vedi deploy/README.md  ->  /etc/nginx/sites-available/logidock.conf

server {
    listen 80;
    server_name _;

    # Non rivelare la versione di Nginx.
    server_tokens off;

    # ---- Accesso solo dalla rete locale ------------------------------------------------------
    # CAMBIA la subnet con quella reale dell'azienda. Le regole valgono per TUTTE le location
    # (nessuna location sotto ridefinisce allow/deny). Tutto il resto riceve 403.
    allow 127.0.0.1;
    allow 192.168.1.0/24;
    deny all;

    # Unica cartella esposta: .env, src, vendor, database, deploy restano fuori dal document root.
    root /var/www/logidock/public;
    index index.php;

    client_max_body_size 1m;

    access_log /var/log/nginx/logidock.access.log;
    error_log  /var/log/nginx/logidock.error.log;

    # ---- Intestazioni di sicurezza -----------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # L'app non usa script o stili inline né risorse esterne.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # ---- Routing ------------------------------------------------------------------------------
    location / {
        # File statico se esiste, altrimenti front controller (router PHP).
        try_files $uri /index.php?$query_string;
    }

    # Solo index.php viene passato a PHP-FPM.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm-logidock.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # Qualunque altro .php non viene mai eseguito.
    location ~ \.php$ {
        return 404;
    }

    # ---- File sensibili -----------------------------------------------------------------------
    # Difesa in profondità: questi file non dovrebbero nemmeno stare in public/, ma se per errore
    # ci finiscono non devono essere serviti.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(env|sql|bak|log|lock|ini|sh|yml|yaml|dist|md)$ {
        deny all;
    }

    # ---- Asset statici ------------------------------------------------------------------------
    location /assets/ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        # add_header in una location annulla quelli del server: si ripetono quelli di sicurezza.
        add_header X-Content-Type-Options "nosniff" always;
    }
}
