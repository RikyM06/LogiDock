; Pool PHP-FPM dedicato a LogiDock (Ubuntu Server 24.04, PHP 8.3).
; Installazione: vedi deploy/README.md  ->  /etc/php/8.3/fpm/pool.d/logidock.conf
; Il pool predefinito "www" va disattivato (rinominando www.conf).

[logidock]
user = www-data
group = www-data

; Socket Unix (non TCP): raggiungibile solo da Nginx sulla stessa macchina.
listen = /run/php/php8.3-fpm-logidock.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Pochi processi: pochi utenti in LAN.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

request_terminate_timeout = 30s
catch_workers_output = yes

; Esegue solo file .php (con Nginx che passa solo index.php, è una seconda barriera).
security.limit_extensions = .php

; L'ambiente di PHP viene pulito: la configurazione arriva solo dal file .env dell'applicazione.
clear_env = yes

; ---- Errori: mai a video, sempre su file (l'app ha il suo log in storage/logs) -----------------
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-logidock.log

; ---- Sessioni -------------------------------------------------------------------------------------
; Cartella dedicata (da creare: vedi README). Motivo: su Ubuntu la pulizia delle sessioni vecchie
; la fa un cron di sistema che usa la durata del php.ini globale (24 minuti) e cancellerebbe le
; sessioni dell'app prima della scadenza voluta. Con una cartella nostra e la pulizia di PHP
; attiva qui sotto, la scadenza resta quella configurata nell'app (SESSION_LIFETIME_MINUTES).
php_admin_value[session.save_path] = /var/lib/php/logidock-sessions
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
; php_value (non admin): l'applicazione lo sovrascrive col valore di SESSION_LIFETIME_MINUTES.
php_value[session.gc_maxlifetime] = 7200
