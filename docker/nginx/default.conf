# Nginx per lo SVILUPPO in Docker. La versione di produzione (con limite alla subnet
# e intestazioni di sicurezza) è in deploy/nginx/logidock.conf.
server {
    listen 80;
    server_name localhost;

    # Unica cartella esposta: tutto il resto del progetto (.env, src, vendor...) resta fuori.
    root /var/www/html/public;
    index index.php;

    location / {
        # File statico se esiste, altrimenti passa al front controller (router PHP).
        try_files $uri /index.php?$query_string;
    }

    # Solo index.php viene eseguito da PHP.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    # File nascosti (.env, .git...) mai raggiungibili.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
