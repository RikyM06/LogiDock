# Ambiente di SVILUPPO: Nginx + PHP-FPM + MySQL, come in produzione ma in container.
# Versioni allineate a Ubuntu Server 24.04: PHP 8.3, Nginx 1.24, MySQL 8.0.
# Il codice viene montato dalla cartella del progetto: le modifiche si vedono subito.
#
# Primo avvio (vedi README.md, sezione "Avvio con Docker"):
#   1. nel .env imposta DB_HOST=db e una DB_PASSWORD
#   2. docker compose up -d --build
#   3. docker compose run --rm php composer install
#   4. docker compose run --rm php php bin/migrate.php
#   5. docker compose run --rm php php bin/seed.php
# Poi apri http://localhost:8080

services:
  nginx:
    image: nginx:1.24
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: ./docker/php
    volumes:
      - ./:/var/www/html
    environment:
      # Valgono più del file .env: dentro la rete Docker il database si chiama "db".
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-logidock}
      MYSQL_USER: ${DB_USER:-logidock}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Imposta DB_PASSWORD nel file .env}
    # log-bin-trust-function-creators: serve per creare i trigger della migrazione 0009
    # (vedi README, sezione Database).
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --log-bin-trust-function-creators=1
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Esposto solo su localhost, per usare un client SQL dal PC.
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
